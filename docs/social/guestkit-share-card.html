<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuestKit share card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  :root{
    --bg:#060a10;
    --ink:#f4f7fb;
    --ink-soft:#aab4c3;
    --ink-dim:#6b7686;
    --accent:#0a84ff;
    --accent-soft:#6cb4ff;
    --line:rgba(10,132,255,.55);
  }
  *{box-sizing:border-box;margin:0;}
  html,body{width:1200px;height:630px;background:var(--bg);overflow:hidden;}
  .card{
    position:relative;width:1200px;height:630px;
    background:
      radial-gradient(circle at 900px 315px, rgba(10,132,255,.16), transparent 340px),
      radial-gradient(circle, rgba(255,255,255,.055) 1px, transparent 1.4px) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  }
  .edge{position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent);}
  .left{position:absolute;left:64px;top:0;width:560px;height:100%;}
  .eyebrow{
    position:absolute;top:100px;
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:15px;
    letter-spacing:.24em;color:var(--accent-soft);text-transform:uppercase;
  }
  h1{
    position:absolute;top:128px;
    font-size:128px;line-height:1;font-weight:700;letter-spacing:-.035em;
  }
  .tag{
    position:absolute;top:292px;width:540px;text-wrap:balance;
    font-size:25px;line-height:1.42;font-weight:500;color:var(--ink-soft);
  }
  .pills{position:absolute;top:436px;display:flex;flex-wrap:nowrap;gap:9px;width:580px;}
  .pill{
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:13px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--accent-soft);white-space:nowrap;
    padding:10px 13px;border:1px solid var(--line);border-radius:999px;
    background:rgba(10,132,255,.08);
  }
  .foot{
    position:absolute;top:566px;
    font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink-dim);letter-spacing:.02em;
  }
  svg{position:absolute;left:600px;top:0;}
  svg text{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:15px;letter-spacing:.1em;fill:var(--ink-soft);}
</style>
</head>
<body>
<div class="card">
  <div class="edge"></div>
  <div class="left">
    <div class="eyebrow">Offline VM intelligence</div>
    <h1>GuestKit</h1>
    <p class="tag">Score boot readiness before power-on. Repair disks offline. Certify cutover with a Passport.</p>
    <div class="pills">
      <span class="pill">Pure-Rust</span>
      <span class="pill">Offline-first</span>
      <span class="pill">6 disk formats</span>
      <span class="pill">Apache 2.0</span>
    </div>
    <div class="foot">github.com/zyvorai/guestkit</div>
  </div>

  <!-- Gauge + six disk-format spokes, centred at (300,315) in this 600x630 box -->
  <svg width="600" height="630" viewBox="0 0 600 630" xmlns="http://www.w3.org/2000/svg">
    <g id="spokes" stroke="#0a84ff" stroke-opacity=".55" stroke-width="1.5"></g>
    <g id="ticks" stroke="#0a84ff" stroke-opacity=".5"></g>
    <circle cx="300" cy="315" r="86" fill="#070d16" stroke="#0a84ff" stroke-opacity=".25" stroke-width="6"/>
    <!-- 0-100 arc: 270 degrees, starts at 7:30 o'clock -->
    <path id="arc" fill="none" stroke="#0a84ff" stroke-width="6" stroke-linecap="round"/>
    <text x="300" y="296" text-anchor="middle" style="font-size:12px;letter-spacing:.2em;fill:#6b7686">BOOT SCORE</text>
    <text x="300" y="338" text-anchor="middle" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;letter-spacing:-.02em;fill:#f4f7fb">0–100</text>
    <g id="dots" fill="#3fa0ff"></g>
    <g id="labels"></g>
  </svg>
</div>
<script>
  const NS='http://www.w3.org/2000/svg', cx=300, cy=315;
  const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;};
  const pt=(deg,r)=>[cx+r*Math.cos(deg*Math.PI/180), cy+r*Math.sin(deg*Math.PI/180)];

  // Gauge arc, 270 degrees from 135 deg (bottom-left) sweeping clockwise to 45 deg.
  const [ax,ay]=pt(135,86), [bx,by]=pt(45,86);
  document.getElementById('arc').setAttribute('d',`M${ax},${ay} A86,86 0 1,1 ${bx},${by}`);

  // Minor ticks around the gauge.
  const ticks=document.getElementById('ticks');
  for(let i=0;i<60;i++){
    const d=i*6, major=i%5===0;
    const [x1,y1]=pt(d,major?98:100), [x2,y2]=pt(d,108);
    el('line',{x1,y1,x2,y2,'stroke-width':major?2:1},ticks);
  }

  // Six spokes: one per disk format.
  const fmts=[['QCOW2',-90],['VMDK',-30],['VHDX',30],['VHD',90],['VDI',150],['RAW',210]];
  const spokes=document.getElementById('spokes'), dots=document.getElementById('dots'), labels=document.getElementById('labels');
  for(const [name,deg] of fmts){
    const [x1,y1]=pt(deg,116), [x2,y2]=pt(deg,196);
    el('line',{x1,y1,x2,y2},spokes);
    el('circle',{cx:x2,cy:y2,r:5.5},dots);
    const [lx,ly]=pt(deg,220);
    const cos=Math.cos(deg*Math.PI/180);
    const anchor=Math.abs(cos)<.1?'middle':(cos>0?'start':'end');
    const t=el('text',{x:lx+(anchor==='start'?-6:anchor==='end'?6:0),y:ly+5,'text-anchor':anchor},labels);
    t.textContent=name;
  }
</script>
</body>
</html>
