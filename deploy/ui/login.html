<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>GuestKit — Sign In</title>
<link rel="icon" type="image/svg+xml" href="zyvor-mark.svg">
<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08);--blue:#0071e3;--accent:#ff5a15;--shadow:0 18px 60px rgba(0,0,0,.08)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -20%,#fff 0,#f5f5f7 42%,#ececf0 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.card{width:min(420px,100%);background:rgba(255,255,255,.84);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);border-radius:30px;padding:36px 32px}
.brand{display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:inherit;font-weight:700;letter-spacing:-.02em;margin-bottom:22px}
.brand-zyvor{font-weight:800;color:var(--accent);margin-right:.22em}
h1{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}
p{margin:0 0 18px;color:var(--muted);line-height:1.45}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:14px inherit;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:12px 22px;font:600 15px inherit;cursor:pointer;background:var(--blue);color:#fff;margin-top:8px;text-align:center;text-decoration:none}
.btn.secondary{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);margin-top:10px}
.err{color:#d70015;font-size:13px;min-height:1.2em;margin:0 0 8px}
.foot{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
.hidden{display:none}
</style>
</head><body>
<div class="card">
  <a class="brand" href="https://zyvor.dev" target="_blank" rel="noopener">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2h14L6.6 16H16" fill="none" stroke="#ff5a15" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span><span class="brand-zyvor">zyvor</span> GuestKit</span>
  </a>
  <h1>Sign in</h1>
  <p id="subtitle">Authenticate to the GuestKit API.</p>
  <div class="err" id="err"></div>
  <div id="localForm">
    <label for="user">Username</label>
    <input id="user" autocomplete="username" placeholder="admin">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn" type="button" id="localBtn">Sign in</button>
  </div>
  <a class="btn secondary hidden" id="oidcBtn" href="#">Sign in with SSO</a>
  <a class="btn secondary hidden" id="samlBtn" href="#">Sign in with SAML</a>
  <button class="btn secondary hidden" type="button" id="bypassBtn">Continue without SSO</button>
  <a class="btn secondary" href="index.html">Back to console</a>
  <div class="foot">Built by Zyvor</div>
</div>
<script src="api.js"></script>
<script>
(async function(){
  const A=window.GuestKitAPI;
  const err=document.getElementById('err');
  const params=new URLSearchParams(location.search);
  if(params.get('token')){A.setAuthToken(params.get('token'));location.replace('index.html');return}
  if(params.get('error')) err.textContent=params.get('error');

  let cfg={auth_enabled:false,allow_local_bypass:true};
  try{cfg=await A.fetchAuthConfig()}catch{/* */}
  if(!cfg.auth_enabled){
    document.getElementById('subtitle').textContent='API auth is off — continue to the console.';
    document.getElementById('localForm').classList.add('hidden');
    return;
  }
  if(cfg.oidc_enabled){
    const b=document.getElementById('oidcBtn');
    b.classList.remove('hidden');
    b.textContent=cfg.oidc_button_label||'Sign in with SSO';
    b.href=A.API_BASE+'/auth/oidc/login';
  }
  if(cfg.saml_enabled){
    const b=document.getElementById('samlBtn');
    b.classList.remove('hidden');
    b.textContent=cfg.saml_button_label||'Sign in with SAML';
    b.href=A.API_BASE+'/auth/saml/login';
  }
  if(cfg.allow_local_bypass){
    const b=document.getElementById('bypassBtn');
    b.classList.remove('hidden');
    b.onclick=async()=>{
      try{await A.localLogin();location.href='index.html'}
      catch(e){err.textContent=e.message}
    };
  }
  document.getElementById('localBtn').onclick=async()=>{
    try{
      await A.localLogin(document.getElementById('user').value.trim(), document.getElementById('pass').value);
      location.href='index.html';
    }catch(e){err.textContent=e.message}
  };
})();
</script>
</body></html>
