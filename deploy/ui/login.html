<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>GuestKit — Sign In</title>
<link rel="icon" type="image/svg+xml" href="zyvor-mark.svg">
<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08);--blue:#0071e3;--accent:#ff5a15;--shadow:0 18px 60px rgba(0,0,0,.08)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -20%,#fff 0,#f5f5f7 42%,#ececf0 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.card{width:min(420px,100%);background:rgba(255,255,255,.84);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);border-radius:30px;padding:36px 32px;text-align:center}
.brand{display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:inherit;font-weight:700;letter-spacing:-.02em;margin-bottom:22px}
.brand-zyvor{font-weight:800;color:var(--accent);margin-right:.22em}
h1{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}
p{margin:0 0 24px;color:var(--muted);line-height:1.45}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 22px;font:600 15px inherit;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
</style>
</head><body>
<div class="card">
  <a class="brand" href="https://zyvor.dev" target="_blank" rel="noopener">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2h14L6.6 16H16" fill="none" stroke="#ff5a15" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span><span class="brand-zyvor">zyvor</span> GuestKit</span>
  </a>
  <h1>Sign in</h1>
  <p>Continue to the offline VM readiness console.</p>
  <a class="btn" href="index.html">Continue</a>
  <div class="foot">Built by Zyvor</div>
</div>
</body></html>
