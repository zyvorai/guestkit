<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='8' y1='8' x2='56' y2='56' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23ff8a3d'/%3E%3Cstop offset='1' stop-color='%23f0583a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23bg)'/%3E%3Cpath d='M19 18h26v7L29 40h16v7H19v-7l16-15H19z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='8' y1='8' x2='56' y2='56' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23ff8a3d'/%3E%3Cstop offset='1' stop-color='%23f0583a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23bg)'/%3E%3Cpath d='M19 18h26v7L29 40h16v7H19v-7l16-15H19z' fill='%23fff'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>GuestKit — Sign In</title>
  <link rel="stylesheet" href="abyss-tokens.css?v=20260627abyss1" />
  <link rel="stylesheet" href="abyss-components.css?v=20260710fix6" />
  <link rel="stylesheet" href="style.css?v=20260627abyss1" />
  <style>
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(1200px 580px at 50% -220px, rgba(243, 107, 33, 0.13), transparent 72%),
        #ffffff;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    }
    .login-card {
      width: min(420px, 100%);
      padding: 2rem;
      border-radius: 24px;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(24px) saturate(1.8);
      box-shadow: 0 22px 70px rgba(0,0,0,.10);
    }
    .login-card h1 { margin: 0 0 0.35rem; font-size: 1.5rem; color: #1d1d1f; }
    .login-card p { margin: 0 0 1.25rem; color: #6f625b; }
    .login-error {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: rgba(255, 69, 58, 0.12);
      color: #ff453a;
      font-size: 0.9rem;
    }
    .login-actions { display: grid; gap: 0.75rem; }
    .login-foot { margin-top: 1.25rem; font-size: 0.8rem; color: #95877f; text-align: center; }
    .login-hint { margin-top: 0.9rem; font-size: 0.78rem; color: #95877f; text-align: center; line-height: 1.5; }
    .login-hint code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; padding: 1px 5px; border-radius: 5px; background: rgba(0,0,0,.06); color: #1d1d1f; }
    .login-credit { margin-top: 1.25rem; font-size: 0.75rem; color: #95877f; text-align: center; opacity: .8; }
    .login-credit a { color: #f36b21; text-decoration: none; font-weight: 600; }
    .login-credit a:hover { text-decoration: underline; }
  </style>
  <link rel="stylesheet" href="zyvor-ux.css?v=20260906ga1" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <a href="https://zyvor.dev" target="_blank" rel="noopener noreferrer" title="zyvor.dev" style="display:inline-block;margin-bottom:1rem;border-radius:6px;">
        <img src="img/zyvor-logo.png" width="120" height="40" alt="Zyvor · GuestKit" />
      </a>
      <h1>Sign in to GuestKit</h1>
      <p class="login-subtitle" id="loginSubtitle">Authenticate to access the VM migration console.</p>
      <div class="login-error hidden" id="loginError"></div>
      <div class="login-actions">
        <button type="button" class="btn primary" id="ssoLoginBtn" style="width:100%;">Sign in with SSO</button>
        <button type="button" class="btn glass hidden" id="samlLoginBtn" style="width:100%;">Sign in with SAML</button>
        <button type="button" class="btn glass hidden" id="localBypassBtn" style="width:100%;">Continue without SSO</button>
      </div>
      <p class="login-foot hidden" id="loginFoot">Optional SSO — enable in Settings when you need identity controls.</p>
      <p class="login-hint hidden" id="loginHint">Default admin login: <code>admin</code> / <code>Admin@321</code> — change it after first sign-in.</p>
    </div>
    <p class="login-credit">
      <a href="https://zyvor.dev" target="_blank" rel="noopener noreferrer">zyvor.dev</a>
      <span aria-hidden="true"> · </span>Built by Zyvor
    </p>
  </div>
  <script src="guestkit-auth.js?v=20260710fix6"></script>
  <script>
    (async function initLogin() {
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      const token = params.get('token');
      const errEl = document.getElementById('loginError');
      const footEl = document.getElementById('loginFoot');
      const ssoBtn = document.getElementById('ssoLoginBtn');
      const samlBtn = document.getElementById('samlLoginBtn');
      const bypassBtn = document.getElementById('localBypassBtn');

      if (err) {
        errEl.textContent = err;
        errEl.classList.remove('hidden');
      }

      if (token) {
        GuestKitAuth.setAuthToken(token);
        try {
          await GuestKitAuth.fetchAuthMe();
        } catch (_) {}
        window.location.replace('index.html');
        return;
      }

      const cfg = await GuestKitAuth.fetchAuthConfig();
      if (!cfg.auth_enabled) {
        window.location.replace('index.html');
        return;
      }

      try {
        const existing = await GuestKitAuth.fetchAuthMe();
        if (existing.authenticated) {
          window.location.replace('index.html');
          return;
        }
      } catch (_) {}

      footEl?.classList.remove('hidden');

      ssoBtn.textContent = cfg.oidc_button_label || 'Sign in with SSO';
      if (!cfg.auth_enabled || !cfg.oidc_enabled) {
        ssoBtn.disabled = true;
        ssoBtn.title = 'OIDC SSO is not configured';
      } else {
        ssoBtn.addEventListener('click', () => GuestKitAuth.startOidcLogin());
      }

      samlBtn.textContent = cfg.saml_button_label || 'Sign in with SAML';
      if (cfg.auth_enabled && cfg.saml_enabled) {
        samlBtn.classList.remove('hidden');
        samlBtn.addEventListener('click', () => GuestKitAuth.startSamlLogin());
      }

      if (cfg.allow_local_bypass || !cfg.auth_enabled) {
        bypassBtn.classList.remove('hidden');
        document.getElementById('loginHint')?.classList.remove('hidden');
        bypassBtn.addEventListener('click', async () => {
          try {
            if (cfg.auth_enabled) {
              const data = await GuestKitAuth.localBypassLogin();
              if (data?.token) GuestKitAuth.setAuthToken(data.token);
            }
            window.location.href = 'index.html';
          } catch (e) {
            errEl.textContent = e.message || String(e);
            errEl.classList.remove('hidden');
          }
        });
      }
    })();
  </script>
  <script src="zyvor-ux.js?v=20260906ga1" defer></script>
</body>
</html>
