[package]
name = "guestkit-ebpf-common"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Map key/value layouts shared by the GuestKit in-guest eBPF programs and their loader"

[features]
default = []
user = ["aya"]

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", default-features = false, optional = true }

[lib]
path = "src/lib.rs"
